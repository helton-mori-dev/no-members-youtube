<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Ocultar vídeos de membros</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f0f0f;
      --muted: #606060;
      --border: #e5e5e5;
      --track: #c4c4c4;
      --on: #006926;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #212121;
        --fg: #f1f1f1;
        --muted: #aaaaaa;
        --border: #3f3f3f;
        --track: #606060;
        --on: #2ba640;
      }
    }

    body {
      margin: 0;
      width: 300px;
      padding: 14px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }

    #canal {
      padding: 10px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    #nome {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    #chave {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    #estado {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .switch {
      appearance: none;
      flex: none;
      position: relative;
      width: 36px;
      height: 20px;
      margin: 0;
      border-radius: 10px;
      background: var(--track);
      cursor: pointer;
      transition: background 0.15s;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }

    .switch:checked {
      background: var(--on);
    }

    .switch:checked::after {
      transform: translateX(16px);
    }

    .switch:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .switch:focus-visible {
      outline: 2px solid var(--on);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <h1>Ocultar vídeos de membros</h1>

  <div id="canal" hidden>
    <div id="nome"></div>
    <div id="chave"></div>
  </div>

  <label class="linha">
    <span>Ativa neste canal</span>
    <input id="toggle" class="switch" type="checkbox" role="switch" disabled />
  </label>

  <p id="estado"></p>

  <script src="dist/canal.js"></script>
  <script src="dist/popup.js"></script>
</body>

</html>
